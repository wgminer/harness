<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Harness demo</title>
    <script>
      // Seeded before any app module runs, so scramble tickers and the
      // dictation field draw the same frames on every take.
      (function () {
        let a = 0x5eed;
        Math.random = function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./demo/demoMain.ts"></script>
  </body>
</html>
